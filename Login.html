<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f2f2; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: #fff; padding: 24px; border-radius: 8px; width: 300px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    h2 { text-align: center; margin-top: 0; margin-bottom: 4px; }
    .sub { text-align: center; color: #666; font-size: 14px; margin: 0 0 8px; }
    .small { text-align: center; font-size: 14px; margin: 14px 0 0; }
    .small a { color: #2563eb; text-decoration: none; }
    .foot { text-align: center; font-size: 12px; color: #888; margin: 18px 0 0; }
    label { display: block; margin-top: 12px; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; margin-top: 18px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Welcome back</h2>
    <p class="sub">Please log in to your account to continue.</p>
    <form>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Login</button>
    </form>
    <p class="small"><a href="#">Forgot your password?</a></p>
    <p class="small">Don't have an account? <a href="#">Sign up</a></p>
    <p class="foot">&copy; 2026 My Project. All rights reserved.</p>
  </div>
</body>
</html>
